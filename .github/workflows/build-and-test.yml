name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore LorWM.sln

      - name: Build
        run: dotnet build LorWM.sln --configuration Release --no-restore

      - name: Run checks
        run: dotnet run --project tests/LorWM.Tests/LorWM.Tests.csproj --configuration Release --no-build

name: release-on-merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Define release version
        id: version
        shell: pwsh
        run: |
          $strictSemverPattern = '^v(?<version>\d+\.\d+\.\d+)$'
          $versionNode = Select-Xml -Path src/LorWM/LorWM.csproj -XPath '/Project/PropertyGroup/VersionPrefix'
          $declaredVersion = [version]$versionNode.Node.InnerText
          $latestTag = git tag --list |
            Where-Object { $_ -match $strictSemverPattern } |
            Sort-Object { [version]($_.Substring(1)) } -Descending |
            Select-Object -First 1

          if ($null -eq $latestTag) {
            $version = $declaredVersion
          } else {
            $current = [version]$latestTag.Substring(1)
            $version = if ($declaredVersion -gt $current) {
              $declaredVersion
            } else {
              [version]::new($current.Major, $current.Minor, $current.Build + 1)
            }
          }

          $version = $version.ToString(3)
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore LorWM.sln

      - name: Build
        run: dotnet build LorWM.sln --configuration Release --no-restore

      - name: Run checks
        run: dotnet run --project tests/LorWM.Tests/LorWM.Tests.csproj --configuration Release --no-build

      - name: Publish self-contained Windows build
        shell: pwsh
        run: >-
          dotnet publish src/LorWM/LorWM.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $archive = "LorWM-${{ steps.version.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/$archive"
          "archive=artifacts/$archive" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.package.outputs.archive }}"
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "LorWM ${{ steps.version.outputs.tag }}"
          --generate-notes
